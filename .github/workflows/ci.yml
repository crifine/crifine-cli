name: CI

on:
  push: { branches: [main] }
  pull_request:

# No publishing here — this workflow only proves the code builds and its tests
# pass. Releasing to npm is a deliberate, manual act.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main

    steps:
      - uses: actions/checkout@v4
        with: { path: main }

      # @crifine/sdk is not on npm yet, so it is built from source and linked
      # in. Doing it here rather than committing a `file:` dependency keeps the
      # published package.json honest — a `file:` path in a release would break
      # for everyone who installs it.
      - uses: actions/checkout@v4
        with:
          repository: crifine/crifine-sdk
          path: crifine-sdk

      # setup-node comes FIRST. pnpm/action-setup runs `pnpm store path` while
      # it installs, using whatever node is already on the runner — and the
      # runner default (20) is below the 22.13 that pnpm 11 requires, so that
      # step dies with ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repo is checked out into `main/`, so the workspace root has no
      # package.json for the action to read. Point it at the real one rather
      # than pinning a version here, which would conflict with the
      # `packageManager` field the manifest already declares.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: main/package.json

      - name: Build the SDK
        working-directory: crifine-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Applied to the runner's copy only, never committed. Done with node
      # rather than `pnpm pkg set`, which cannot address a scoped package name.
      - name: Link the local SDK
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies["@crifine/sdk"] = "link:../crifine-sdk";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: "Fail if a file: dependency was committed"
        run: |
          if git -C . show HEAD:package.json | grep -q '"file:'; then
            echo "package.json ships a file: dependency — it would break on install"
            exit 1
          fi
